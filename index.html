<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07110c">
<title>Thư mời dự lễ tốt nghiệp · Đức Thông</title>
<meta name="description" content="Thư mời dự lễ tốt nghiệp của Đức Thông · 17/10/2026 · Đại học Tôn Đức Thắng">
<meta property="og:title" content="Thư mời dự lễ tốt nghiệp · Graduation Invitation">
<meta property="og:description" content="17/10/2026 · Sảnh Tòa nhà C, Đại học Tôn Đức Thắng">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Cả 3 font đều hỗ trợ tiếng Việt -->
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">

<style>
:root{
  --moss-9:#06100b; --moss-8:#0b1a11; --moss-7:#112a1b; --moss-6:#1a3b27;
  --sage:#8aa377; --olive:#b4c08a;
  --gold:#e8c56e; --gold-hi:#fff0b8; --gold-lo:#b58d3a;
  --cream:#f4eed6; --mist:rgba(236,240,216,.78);
  --f-display:'Cormorant Garamond','Playfair Display',Georgia,'Times New Roman',serif;
  --f-ui:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-script:'Dancing Script','Segoe Script','Brush Script MT',cursive;
  --ease:cubic-bezier(.22,.8,.22,1);
  --flip:cubic-bezier(.65,.02,.25,1);
  --foil:linear-gradient(100deg,#b8893a 0%,#fff1bd 26%,#e8c56e 46%,#fff7d6 62%,#a97f2e 100%);
}
/* kích thước chữ: máy tính (px, nằm trong khung thiệp tự co giãn) / điện thoại (rem) */
body{
  --pad:44px; --gap:20px;
  --fs-title:70px; --fs-name:36px; --fs-date:27px; --fs-poem:31px; --fs-para:27px; --fs-quote:44px; --fs-end:50px;
  --fs-kick:40px; --fs-rowb:25px; --fs-rows:13px; --fs-cd:38px; --fs-wish:25px; --fs-copy:12.5px; --fs-sig:68px;
  --ph-h:548px; --ph-w:auto; --map-h:410px; --portal-h:400px;
}
body.mode-mob{
  --pad:clamp(28px,7.5vw,46px); --gap:18px;
  --fs-title:clamp(2.5rem,12.6vw,3.8rem); --fs-name:clamp(1.55rem,6.4vw,2rem); --fs-date:clamp(1.15rem,5vw,1.5rem);
  --fs-poem:clamp(1.45rem,6.4vw,1.9rem); --fs-para:clamp(1.2rem,5.3vw,1.5rem); --fs-quote:clamp(1.9rem,8.8vw,2.6rem);
  --fs-end:clamp(1.85rem,8.4vw,2.6rem); --fs-kick:clamp(1.8rem,7.6vw,2.4rem); --fs-rowb:clamp(1.15rem,5.2vw,1.5rem); --fs-rows:.8rem;
  --fs-cd:clamp(1.7rem,8.2vw,2.4rem); --fs-wish:clamp(1.15rem,5vw,1.4rem); --fs-copy:.75rem; --fs-sig:clamp(2.7rem,12.5vw,3.7rem);
  --ph-h:auto; --ph-w:min(270px,66vw); --map-h:auto; --portal-h:clamp(340px,58svh,520px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--moss-9);color:var(--cream);font-family:var(--f-ui);font-weight:300;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.mode-desk{overflow:hidden;height:100vh;height:100dvh}
body.mode-mob.locked,body.noscroll{overflow:hidden}
body.mode-mob.locked{height:100vh;height:100dvh}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px;border-radius:6px}
.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.noanim,.noanim *{transition:none!important}

/* ============ THẾ GIỚI NỀN (tối) ============ */
.world{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--moss-9);pointer-events:none}
.bg{position:absolute;inset:-5%;background-image:var(--fb);background-size:cover;background-position:center;opacity:0;transition:opacity 2.4s ease;animation:kenburns 46s ease-in-out infinite alternate;will-change:transform,opacity}
.bg:nth-child(2){animation-duration:58s;animation-direction:alternate-reverse}
.bg:nth-child(3){animation-duration:52s}
.bg.img{filter:brightness(.44) saturate(.88) contrast(1.05)}
.bg.on{opacity:1}
@keyframes kenburns{from{transform:scale(1.02) translate3d(0,0,0)}to{transform:scale(1.13) translate3d(-1.6%,-1.1%,0)}}
.veil{position:absolute;inset:0;background:
  radial-gradient(120% 90% at 50% 42%,rgba(4,10,7,.1) 0%,rgba(3,8,5,.74) 100%),
  linear-gradient(180deg,rgba(4,10,7,.55),rgba(4,10,7,.28) 40%,rgba(4,10,7,.7))}
.sun{position:absolute;top:-24vmax;right:-20vmax;width:66vmax;height:66vmax;border-radius:50%;background:radial-gradient(circle,rgba(255,234,166,.42),rgba(255,214,120,.14) 38%,transparent 66%);animation:sunPulse 9s ease-in-out infinite alternate}
@keyframes sunPulse{from{opacity:.65;transform:scale(.94)}to{opacity:1;transform:scale(1.06)}}
.rays{position:absolute;inset:0;overflow:hidden}
.rays i{position:absolute;top:-14%;width:var(--w);height:130%;background:radial-gradient(ellipse 50% 72% at 50% 0%,rgba(255,229,152,.34),rgba(255,229,152,.1) 55%,transparent 82%);transform-origin:50% 0;transform:rotate(var(--rot));opacity:var(--o);animation:ray 10s ease-in-out var(--dl) infinite alternate}
@keyframes ray{from{opacity:calc(var(--o)*.3);transform:rotate(var(--rot)) scaleX(.8)}to{opacity:var(--o);transform:rotate(calc(var(--rot) + 2.6deg)) scaleX(1.12)}}
.dap{position:absolute;left:-15%;top:-15%;width:130%;height:130%;opacity:.6;animation:dapA 22s ease-in-out infinite alternate,dapBreath 7s ease-in-out infinite alternate}
.dap.b{opacity:.45;animation:dapB 29s ease-in-out infinite alternate,dapBreath 11s ease-in-out -4s infinite alternate}
@keyframes dapA{from{transform:translate3d(-2.2%,1.6%,0) rotate(-1.4deg) scale(1.04)}to{transform:translate3d(2.2%,-1.2%,0) rotate(1.2deg) scale(1)}}
@keyframes dapB{from{transform:translate3d(2%,-1.5%,0) rotate(1.8deg) scale(1)}to{transform:translate3d(-2.4%,1.8%,0) rotate(-1.2deg) scale(1.05)}}
@keyframes dapBreath{from{opacity:.28}to{opacity:.72}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}

/* ============ UI CỐ ĐỊNH ============ */
.prog{position:fixed;z-index:190;left:0;right:0;top:0;height:2px;pointer-events:none}
body.mode-desk .prog{display:none}
.prog i{display:block;height:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--sage),var(--gold),var(--gold-hi));box-shadow:0 0 12px rgba(232,197,110,.7)}
.ui{position:fixed;z-index:200;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;gap:10px;align-items:center}
.seg{position:relative;display:flex;padding:3px;border-radius:999px;background:rgba(6,14,9,.66);border:1px solid rgba(232,197,110,.36);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.seg button{position:relative;z-index:1;border:0;background:none;font:500 .74rem/1 var(--f-ui);letter-spacing:.08em;padding:10px 14px;border-radius:999px;cursor:pointer;color:var(--mist);transition:color .35s}
.seg button[aria-pressed=true]{color:#1b1505}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:linear-gradient(135deg,var(--gold-hi),var(--gold));box-shadow:0 0 16px rgba(232,197,110,.45);transition:transform .55s var(--ease)}
.seg[data-a=en] .thumb{transform:translateX(100%)}
.snd{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--gold);background:rgba(6,14,9,.66);border:1px solid rgba(232,197,110,.36);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:transform .3s var(--ease)}
.snd:hover{transform:scale(1.08)}
.snd .ic{width:19px;height:19px}
.snd .off{display:none}
.snd[aria-pressed=false] .on{display:none}
.snd[aria-pressed=false] .off{display:block;color:var(--olive)}
.snd[aria-pressed=true]::after{content:"";position:absolute;inset:-1px;border-radius:50%;border:1px solid var(--gold);animation:ripple 2.8s ease-out infinite}
@keyframes ripple{from{transform:scale(1);opacity:.7}to{transform:scale(1.7);opacity:0}}

/* mũi tên + chấm chuyển trang (máy tính) */
.arrow{position:fixed;z-index:60;top:50%;translate:0 -50%;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--gold-hi);background:rgba(6,14,9,.62);border:1px solid rgba(232,197,110,.5);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .7s ease,transform .35s var(--ease),box-shadow .35s,background .35s}
.arrow .ic{width:24px;height:24px}
.arrow.prev{left:calc(env(safe-area-inset-left,0px) + 18px)}
.arrow.next{right:calc(env(safe-area-inset-right,0px) + 18px)}
.arrow:hover{box-shadow:0 0 28px rgba(232,197,110,.4);background:rgba(232,197,110,.16)}
.arrow.prev:hover{transform:translateX(-3px)}
.arrow.next:hover{transform:translateX(3px)}
.arrow[hidden]{display:none}
.arrow:disabled{opacity:.25!important;cursor:default}
.dots{position:fixed;z-index:60;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);translate:-50% 0;display:flex;gap:11px;padding:9px 14px;border-radius:999px;background:rgba(6,14,9,.55);border:1px solid rgba(232,197,110,.22);opacity:0;pointer-events:none;transition:opacity .7s ease}
.dots button{width:9px;height:9px;border-radius:999px;border:0;background:rgba(232,197,110,.35);cursor:pointer;transition:width .5s var(--ease),background .4s}
.dots button.on{width:28px;background:var(--gold)}
.dots button:hover{background:var(--gold-hi)}
body.mode-desk.ready .arrow{opacity:1;pointer-events:auto}
body.mode-desk.ready .dots{opacity:1;pointer-events:auto}
body.mode-mob .arrow,body.mode-mob .dots{display:none}

/* ============ SÂN KHẤU: thiệp = cuốn sổ gồm nhiều lá ============ */
.stage{position:relative;z-index:2}
.fit,.book{position:relative}
body.mode-desk .stage{position:fixed;inset:0;overflow:hidden}
body.mode-desk .fit{position:absolute;left:50%;top:50%;width:1200px;height:720px;margin:-360px 0 0 -600px;transform:scale(var(--s,1));transform-origin:50% 50%}
body.mode-desk .book{position:absolute;inset:0;perspective:3400px;transform:translate3d(var(--bx,0px),0,0) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform 1.7s var(--flip),scale 1.7s var(--flip)}
body.mode-desk .book.closed{--bx:-264px;scale:.86;transition:transform .55s ease-out,scale 1s var(--ease);animation:cardFloat 6.5s ease-in-out infinite alternate}
@keyframes cardFloat{from{translate:0 -9px}to{translate:0 9px}}
body.mode-desk .book::before{content:"";position:absolute;left:3%;right:3%;bottom:-38px;height:66px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%);filter:blur(12px);transition:left 1.6s var(--flip),right 1.6s var(--flip)}
body.mode-desk .book.closed::before{left:56%;right:4%}
body.mode-desk .leaf{position:absolute;left:50%;top:0;width:50%;height:100%;transform-origin:0 50%;transform-style:preserve-3d;transition:transform 1.55s var(--flip)}
body.mode-desk .leaf.flipped{transform:rotateY(-180deg)}
body.mode-desk .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
body.mode-desk .face.back{transform:rotateY(180deg)}
body.mode-desk .face{pointer-events:none}
body.mode-desk .face.live{pointer-events:auto}

/* điện thoại: các trang giấy xếp dọc */
body.mode-mob .stage{padding:calc(env(safe-area-inset-top,0px) + 62px) 0 calc(env(safe-area-inset-bottom,0px) + 40px);transition:opacity 1s ease}
body.mode-mob:not(.ready) .stage{opacity:0;pointer-events:none}
body.mode-mob .leaf{display:contents}
body.mode-mob .leaf.cover,body.mode-mob .face.blank{display:none}
body.mode-mob .face{position:relative;width:min(94vw,600px);margin:16px auto}
body.mode-mob .face.back{transform:none}

/* ============ TRANG GIẤY ============ */
.page{color:var(--cream);padding:var(--pad);overflow:hidden;
  background:
    radial-gradient(110% 80% at 88% 0%,rgba(255,226,150,.1),transparent 55%),
    radial-gradient(70% 50% at 8% 100%,rgba(138,163,119,.08),transparent 60%),
    repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 2px,transparent 2px 5px),
    linear-gradient(160deg,#14291d,#0c1b12 58%,#08130d);
  box-shadow:0 1px 0 rgba(232,197,110,.25),0 0 0 1px rgba(0,0,0,.4)}
.page.R{border-radius:4px 14px 14px 4px}
.page.L{border-radius:14px 4px 4px 14px}
body.mode-mob .page{border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 0 1px rgba(232,197,110,.25)}
body.mode-mob .face.page{padding:calc(var(--pad) + 22px) var(--pad)}
body.mode-mob .page>.corner{width:34px;height:34px}
.page::before{content:"";position:absolute;inset:15px;border:1px solid rgba(232,197,110,.34);border-radius:8px;pointer-events:none;z-index:2}
.page::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.12) 9%,transparent 17%)}
.page.L::after{background:linear-gradient(270deg,rgba(0,0,0,.55),rgba(0,0,0,.12) 9%,transparent 17%)}
body.mode-mob .page::after{display:none}
.page .shade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:6}
.leaf.turning .shade{animation:shade 1.55s ease-in-out}
@keyframes shade{0%,100%{opacity:0}50%{opacity:.62}}
.page>.corner{position:absolute;z-index:4;width:46px;height:46px;color:var(--gold);fill:none;stroke:currentColor;stroke-width:1.3;overflow:visible;opacity:.9;pointer-events:none}
.corner.tl{top:12px;left:12px}
.corner.tr{top:12px;right:12px;transform:scaleX(-1)}
.corner.bl{bottom:12px;left:12px;transform:scaleY(-1)}
.corner.br{bottom:12px;right:12px;transform:scale(-1,-1)}
.pg{position:relative;z-index:1;width:100%;height:100%;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--gap)}
body.mode-mob .pg{height:auto}

/* ============ HIỆU ỨNG HIỆN DẦN ============ */
.blk{opacity:0;transform:translateY(34px) scale(.97);transition:opacity 1.1s var(--ease) var(--d,0s),transform 1.3s var(--ease) var(--d,0s)}
.in .blk,.blk.in{opacity:1;transform:none}
.w{display:inline-block;opacity:0;transform:translateY(.55em);filter:blur(9px);transition:opacity 1.1s var(--ease),transform 1.3s var(--ease),filter 1.1s var(--ease);transition-delay:calc(var(--b,0s) + var(--i,0)*var(--st,.06s))}
.in .w{opacity:1;transform:none;filter:none}
.kick{display:block;font:600 var(--fs-kick)/1.15 var(--f-script);color:var(--gold);text-shadow:0 0 26px rgba(232,197,110,.4)}
.script{font:600 var(--fs-name)/1.2 var(--f-script);color:var(--olive)}
.divider{display:flex;align-items:center;justify-content:center;gap:14px;width:min(300px,70%);color:var(--gold)}
.divider i{flex:1;height:1px;background:linear-gradient(90deg,transparent,currentColor,transparent);opacity:.65;transform:scaleX(0);transition:transform 1.5s var(--ease) .5s}
.in .divider i{transform:none}
.divider svg{width:20px;height:20px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:11px 18px;border-radius:999px;border:1px solid rgba(232,197,110,.55);background:linear-gradient(180deg,rgba(232,197,110,.18),rgba(232,197,110,.05));color:var(--gold-hi);font:400 .84rem/1.1 var(--f-ui);text-decoration:none;cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s,background .35s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(232,197,110,.24);background:linear-gradient(180deg,rgba(232,197,110,.3),rgba(232,197,110,.1))}
.btn:active{transform:translateY(0) scale(.97)}
.btn .ic{width:16px;height:16px}
.btn.solid{background:linear-gradient(135deg,#ffeaa6,#e3b94f);color:#231a05;border-color:transparent;font-weight:500}
.btn.solid:hover{background:linear-gradient(135deg,#fff3c4,#efc860)}
.btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* ============ BÌA THIỆP ============ */
.cover-art{border-radius:6px 16px 16px 6px;background:
  radial-gradient(90% 60% at 28% 0%,rgba(255,226,150,.16),transparent 62%),
  repeating-linear-gradient(45deg,rgba(255,255,255,.028) 0 1px,transparent 1px 10px),
  repeating-linear-gradient(-45deg,rgba(255,255,255,.028) 0 1px,transparent 1px 10px),
  linear-gradient(150deg,#21452f,#122a1c 55%,#0a1810);
  box-shadow:0 0 0 1px rgba(0,0,0,.5),inset 0 0 90px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,236,170,.25)}
.cover-art::before{inset:24px;border:0;padding:2.5px;border-radius:10px;background:var(--foil);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude;filter:drop-shadow(0 0 6px rgba(232,197,110,.35))}
.cover-art::after{inset:0;background:linear-gradient(112deg,transparent 36%,rgba(255,244,200,.2) 50%,transparent 64%) 0 0/260% 100%;animation:sweep 6s ease-in-out infinite;z-index:6}
@keyframes sweep{0%{background-position:140% 0}60%,100%{background-position:-40% 0}}
.cover-art>.corner{width:64px;height:64px;color:#f0cf7a;stroke-width:1.5;z-index:4}
.cover-art>.corner.tl{top:34px;left:34px}.cover-art>.corner.tr{top:34px;right:34px}.cover-art>.corner.bl{bottom:34px;left:34px}.cover-art>.corner.br{bottom:34px;right:34px}
.cv-in{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:80px 56px;text-align:center}
.cv-name{font:600 36px/1 var(--f-script);color:var(--gold-hi);text-shadow:0 0 22px rgba(232,197,110,.5)}
.cv-title{display:flex;flex-direction:column;align-items:center;gap:0;font:600 64px/1.04 var(--f-display);filter:drop-shadow(0 4px 22px rgba(232,197,110,.28))}
.cv-title span{display:block;padding:.12em .06em .24em;margin:-.12em 0 -.24em;background:var(--foil);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shimmer 8s linear infinite}
@keyframes shimmer{from{background-position:130% 0}to{background-position:-130% 0}}
.cv-date{font:500 25px/1 var(--f-display);letter-spacing:.34em;padding-left:.34em;color:var(--gold)}
.seal{position:relative;width:148px;height:148px;border-radius:50% 47% 52% 49%/49% 52% 47% 51%;display:grid;place-items:center;color:var(--gold-hi);
  background:radial-gradient(circle at 34% 28%,#497a55,#21472c 52%,#102719);
  box-shadow:inset 0 0 0 5px rgba(0,0,0,.2),inset 0 0 0 7px rgba(255,226,150,.55),inset 0 -10px 24px rgba(0,0,0,.4),0 10px 26px rgba(0,0,0,.6),0 0 46px rgba(232,197,110,.3);
  animation:sealPulse 3.2s ease-in-out infinite alternate}
.seal svg{width:60%;height:60%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.seal::before,.seal::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--gold);opacity:0;animation:sealRing 3.4s ease-out infinite}
.seal::after{animation-delay:1.7s}
@keyframes sealPulse{from{filter:brightness(.95)}to{filter:brightness(1.15)}}
@keyframes sealRing{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.9);opacity:0}}
.seal.crack{animation:crack .8s ease-out forwards}
.seal.crack::before,.seal.crack::after{animation:none}
@keyframes crack{0%{transform:scale(1)}28%{transform:scale(1.2) rotate(-5deg);filter:brightness(1.9)}100%{transform:scale(.3) rotate(16deg);opacity:0;filter:brightness(2.4)}}

/* trang bìa trong: vòng phép + mũ cử nhân */
.inside .pg{gap:12px}
.ring{width:min(100%,430px);aspect-ratio:1;color:var(--gold);filter:drop-shadow(0 0 22px rgba(232,197,110,.35))}
.ring-svg{width:100%;height:100%;overflow:visible}
.ring-svg .r1{animation:spin 140s linear infinite}
.ring-svg .r2{animation:spin 90s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.inside .script{font-size:calc(var(--fs-name)*1.5);line-height:1.15;color:var(--gold-hi);text-shadow:0 0 26px rgba(232,197,110,.5)}

/* ============ NỘI DUNG CÁC TRANG ============ */
.title{font-family:var(--f-display);font-weight:600;font-size:var(--fs-title);line-height:1.05;letter-spacing:.005em;text-wrap:balance;filter:drop-shadow(0 6px 30px rgba(232,197,110,.28))}
.title .w{background:var(--foil);background-size:240% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:shimmer 8s linear infinite;padding:.14em .06em .26em;margin:-.14em -.06em -.26em}
.hero-date{font:500 var(--fs-date)/1.2 var(--f-display);letter-spacing:.34em;padding-left:.34em;color:var(--gold)}
.pl{font:italic 500 var(--fs-poem)/1.34 var(--f-display);color:var(--cream);text-shadow:0 2px 26px rgba(0,0,0,.6),0 0 36px rgba(232,197,110,.14);text-wrap:balance}
.poems{display:flex;flex-direction:column;gap:calc(var(--gap)*.7)}
.poems .pl:last-child{color:var(--gold-hi)}
.para{font:500 var(--fs-para)/1.62 var(--f-display);color:rgba(246,240,220,.97);text-wrap:pretty}
body.mode-mob .para{line-height:1.7}
.rows{list-style:none;display:grid;gap:calc(var(--gap)*.55);text-align:left;width:100%}
.row{display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:center}
.row .ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--gold);border:1px solid rgba(232,197,110,.42);background:radial-gradient(circle at 30% 30%,rgba(232,197,110,.2),rgba(232,197,110,.03))}
.row .ico .ic{width:19px;height:19px}
.row small{display:block;font:300 var(--fs-rows)/1.25 var(--f-ui);color:var(--olive)}
.row b{display:block;font:600 var(--fs-rowb)/1.18 var(--f-display);color:var(--cream)}
.row em{display:block;font:500 calc(var(--fs-rowb)*.76)/1.2 var(--f-display);font-style:normal;color:var(--mist)}
.row .btns{justify-content:flex-start;margin-top:6px;gap:8px}
.row .btn{padding:8px 13px;font-size:.78rem}
.count-wrap{width:100%;padding-top:calc(var(--gap)*.6);border-top:1px solid rgba(232,197,110,.2)}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cd{padding:9px 4px 7px;border-radius:14px;border:1px solid rgba(232,197,110,.26);background:rgba(232,197,110,.05);text-align:center}
.cd b{display:block;font:600 var(--fs-cd)/1 var(--f-display);font-variant-numeric:tabular-nums;color:var(--gold-hi)}
.cd b.t{animation:tick .5s var(--ease)}
@keyframes tick{from{opacity:.2;transform:translateY(-35%)}to{opacity:1;transform:none}}
.cd small{display:block;margin-top:3px;font:300 calc(var(--fs-rows)*.9) var(--f-ui);color:var(--olive)}
.count-note{margin-top:9px;font:italic 500 calc(var(--fs-rowb)*.7)/1.35 var(--f-display);color:var(--mist);text-align:center}
.count-wrap[data-s="1"] .count,.count-wrap[data-s="2"] .count{display:none}
.count-wrap[data-s="1"] .count-note,.count-wrap[data-s="2"] .count-note{margin:0;font-size:calc(var(--fs-rowb)*1.1);color:var(--gold-hi)}

/* bản đồ + cổng trường */
.map-fig{position:relative;width:100%;height:var(--map-h);border-radius:18px;overflow:hidden;border:1px solid rgba(232,197,110,.38);background:linear-gradient(160deg,rgba(14,34,23,.8),rgba(7,16,11,.9));box-shadow:0 18px 50px rgba(0,0,0,.5);cursor:zoom-in;display:grid;place-items:center}
.map-fig:not(.has){min-height:200px;cursor:default}
.map-fig img{display:block;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 1.2s ease,transform 1.2s var(--ease);filter:brightness(.9) sepia(.12) saturate(.95)}
body.mode-mob .map-fig img{height:auto}
.map-fig.has img{opacity:1}
.map-fig.has:hover img{transform:scale(1.015)}
.map-fig::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 40% at 90% 0%,rgba(255,226,150,.2),transparent 70%),linear-gradient(180deg,transparent 70%,rgba(4,10,6,.45))}
.map-fig .cap{position:absolute;right:10px;bottom:10px;z-index:2;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(6,14,9,.74);border:1px solid rgba(232,197,110,.4);font:300 .72rem var(--f-ui);color:var(--gold-hi)}
.map-fig .cap .ic{width:14px;height:14px}
.map-fig:not(.has) .cap{display:none}
.pin{position:absolute;z-index:2;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 0 4px rgba(232,197,110,.35),0 0 22px 6px rgba(232,197,110,.6)}
.pin::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--gold);animation:ripple 2.2s ease-out infinite}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;color:var(--olive);
  background:radial-gradient(70% 50% at 50% 20%,rgba(138,163,119,.14),transparent 70%),repeating-linear-gradient(135deg,rgba(255,255,255,.015) 0 10px,transparent 10px 20px)}
.ph::before{content:"";position:absolute;inset:12px;border:1px dashed rgba(232,197,110,.32);border-radius:inherit}
.ph svg.sp{width:44px;height:44px;color:var(--gold);opacity:.7}
.ph em{font:italic 500 1.1rem var(--f-display)}
.ph code{font:300 .66rem/1.4 var(--f-ui);opacity:.7;word-break:break-all;max-width:90%}
.has>.ph{display:none}
.map-fig .ph{position:relative;width:100%;height:100%;min-height:200px}
.portal{width:100%;border-radius:18px;overflow:hidden;border:1px solid rgba(232,197,110,.38);background:rgba(5,12,8,.85);box-shadow:0 18px 50px rgba(0,0,0,.5)}
.portal-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(180deg,rgba(34,64,43,.9),rgba(12,28,19,.9));border-bottom:1px solid rgba(232,197,110,.25)}
.portal-bar .dots2{display:flex;gap:5px;flex:none}
.portal-bar .dots2 i{width:8px;height:8px;border-radius:50%;background:var(--gold);opacity:.55}
.portal-url{flex:1;min-width:0;padding:6px 12px;border-radius:999px;background:rgba(0,0,0,.36);font:300 .7rem var(--f-ui);color:var(--mist);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.portal-ext{display:inline-flex;align-items:center;gap:5px;flex:none;padding:6px 11px;border-radius:999px;border:1px solid rgba(232,197,110,.45);color:var(--gold-hi);font:400 .7rem var(--f-ui);text-decoration:none;transition:background .3s}
.portal-ext:hover{background:rgba(232,197,110,.16)}
.portal-ext .ic{width:13px;height:13px}
.portal-screen{position:relative;height:var(--portal-h);background:radial-gradient(80% 70% at 50% 40%,#17331f,#07110b)}
.portal-idle{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;border:0;background:none;color:var(--gold-hi)}
.vortex{position:relative;width:min(210px,60%);aspect-ratio:1;display:grid;place-items:center;transition:transform 1.3s var(--ease),opacity 1.1s ease}
.vortex::before,.vortex::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 8%,rgba(232,197,110,.95) 22%,transparent 40%,rgba(138,163,119,.85) 58%,transparent 78%,rgba(232,197,110,.9) 94%,transparent);-webkit-mask:radial-gradient(circle,transparent 47%,#000 49%,#000 66%,transparent 69%);mask:radial-gradient(circle,transparent 47%,#000 49%,#000 66%,transparent 69%);animation:spin 7s linear infinite}
.vortex::after{inset:11%;animation-duration:11s;animation-direction:reverse;opacity:.75}
.vortex .core{width:44%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,240,184,.75),rgba(232,197,110,.22) 55%,transparent 72%);animation:sealPulse 3.4s ease-in-out infinite alternate}
.portal-idle span.t{font:italic 500 1.25rem var(--f-display);text-shadow:0 0 22px rgba(232,197,110,.5)}
.portal.open .vortex{transform:scale(7);opacity:0}
.portal.open .portal-idle{pointer-events:none;opacity:0;transition:opacity 1s ease .5s}
.portal.open .portal-idle span.t{opacity:0;transition:opacity .3s}
.portal iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity 1.2s ease;background:#07110b}
.portal.loaded iframe{opacity:1}
.pz{position:fixed;inset:0;z-index:310;display:none;background:rgba(3,8,5,.9);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.pz.show{display:block}
.pz-win{position:fixed;left:50%;top:50%;translate:-50% -50%;width:min(1180px,94vw);height:min(86vh,880px);height:min(86svh,880px);display:flex;flex-direction:column;box-shadow:0 40px 120px rgba(0,0,0,.7),0 0 80px rgba(232,197,110,.12)}
.pz-screen{flex:1;height:auto;min-height:0}
.pz-load{position:absolute;inset:0;z-index:2;display:grid;place-items:center;pointer-events:none;transition:opacity 1s ease .4s}
.pz-win.loaded .vortex{transform:scale(7);opacity:0}
.pz-win.loaded .pz-load{opacity:0}
.pz-win.loaded iframe{opacity:1}
.pz-x{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;cursor:pointer;background:none;border:1px solid rgba(232,197,110,.5);color:var(--gold-hi);transition:background .3s,transform .3s var(--ease)}
.pz-x:hover{background:rgba(232,197,110,.2);transform:rotate(90deg)}
.pz-x .ic{width:15px;height:15px}
.pz-note{padding:8px 16px;font:300 .72rem/1.5 var(--f-ui);color:var(--olive);text-align:center;background:rgba(5,12,8,.9);border-top:1px solid rgba(232,197,110,.18)}
.pnote{max-width:52ch;font:300 .74rem/1.6 var(--f-ui);color:var(--olive)}

/* ảnh chụp 9:16 */
.photo{position:relative;height:var(--ph-h);width:var(--ph-w);aspect-ratio:9/16;transform:rotate(var(--tilt,0deg)) perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .6s var(--ease);animation:floaty 9s ease-in-out infinite alternate}
@keyframes floaty{from{translate:0 -6px}to{translate:0 7px}}
.photo::before{content:"";position:absolute;inset:-11px;border-radius:38px;border:1px solid rgba(232,197,110,.42);box-shadow:0 0 50px rgba(232,197,110,.1)}
.photo-in{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:#0a160f;box-shadow:0 0 0 1px rgba(232,197,110,.6),0 26px 60px rgba(0,0,0,.6)}
.photo-in img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.06);transition:opacity 1.4s ease,transform 2.2s var(--ease)}
.photo.has img{opacity:1;transform:none}
.photo.has{cursor:zoom-in}
.photo-in::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(70% 42% at 88% 0%,rgba(255,228,150,.3),transparent 72%),radial-gradient(40% 24% at 14% 32%,rgba(255,228,150,.12),transparent 70%),linear-gradient(180deg,transparent 62%,rgba(4,10,6,.4))}
.photo>.corner{position:absolute;width:40px;height:40px;z-index:3;color:var(--gold);fill:none;stroke:currentColor;stroke-width:1.4;overflow:visible}
.photo>.corner.tl{top:-6px;left:-6px}.photo>.corner.tr{top:-6px;right:-6px}.photo>.corner.bl{bottom:-6px;left:-6px}.photo>.corner.br{bottom:-6px;right:-6px}

/* trích dẫn + kết */
.quote{position:relative;font:italic 600 var(--fs-quote)/1.18 var(--f-display);color:var(--gold-hi);text-shadow:0 0 44px rgba(232,197,110,.4),0 4px 24px rgba(0,0,0,.6);text-wrap:balance}
.q-line{display:block;width:min(260px,70%);height:24px;color:var(--gold);fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;overflow:visible}
.q-line path{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 2.2s var(--ease) 1.2s}
.in .q-line path{stroke-dashoffset:0}
.big{font:italic 600 var(--fs-end)/1.24 var(--f-display);color:var(--cream);text-shadow:0 2px 30px rgba(0,0,0,.65),0 0 40px rgba(232,197,110,.22);text-wrap:balance}
.sig-name{font:600 var(--fs-sig)/1 var(--f-script);color:var(--gold-hi);text-shadow:0 0 30px rgba(232,197,110,.6)}
.sig-cap{width:54px;height:54px;color:var(--gold);filter:drop-shadow(0 0 16px rgba(232,197,110,.6))}
.wish{font:italic 500 var(--fs-wish)/1.55 var(--f-display);color:var(--mist);text-wrap:balance}
.copy{font:300 var(--fs-copy)/1.65 var(--f-ui);color:rgba(180,192,138,.9);max-width:46ch}
.copy a{color:var(--gold);text-underline-offset:3px}

/* ============ CỔNG MỞ THIỆP ============ */
.gate{position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity .9s ease,transform 1.2s var(--ease)}
body.mode-mob .gate{background:radial-gradient(90% 70% at 50% 44%,rgba(10,26,17,.5),rgba(3,8,5,.9) 76%)}
.gate.gone{opacity:0;transform:scale(1.12);pointer-events:none}
.gate.opening{pointer-events:none}
.ghint{text-align:center;transition:opacity .5s ease;padding:0 20px}
body.mode-desk .ghint{position:absolute;bottom:clamp(16px,4.5vh,46px);left:0;right:0}
body.mode-mob .ghint{margin-top:20px}
.gate.opening .ghint{opacity:0}
.gate-tap{font:italic 500 clamp(1.5rem,4.4vw,2.1rem)/1.2 var(--f-display);color:var(--gold-hi);text-shadow:0 0 24px rgba(232,197,110,.55);animation:tapPulse 2.6s ease-in-out infinite}
@keyframes tapPulse{0%,100%{opacity:.55}50%{opacity:1}}
.gate-hint{margin-top:6px;font:300 .78rem/1.5 var(--f-ui);color:var(--olive)}
/* thiệp nhỏ cho điện thoại (nhân bản từ bìa) */
.mgate-card{display:none}
body.mode-mob .mgate-card{display:block;position:relative;width:calc(600px*var(--ms,.6));height:calc(720px*var(--ms,.6));animation:cardFloat 6.5s ease-in-out infinite alternate}
.mcard-fit{position:absolute;left:0;top:0;width:600px;height:720px;transform:scale(var(--ms,.6));transform-origin:0 0;perspective:2200px}
.mface{position:absolute;inset:0}
.mbase{isolation:isolate;z-index:0}
.mleaf{z-index:1}
.mleaf{position:absolute;inset:0;transform-origin:0 50%;transform-style:preserve-3d;transition:transform 1.6s var(--flip)}
.mleaf .mface{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mleaf .mback{transform:rotateY(180deg)}
.mgate-card.open .mleaf{transform:rotateY(-172deg)}
.mgate-card::before{content:"";position:absolute;left:6%;right:6%;bottom:-26px;height:46px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.6),transparent 70%);filter:blur(10px)}

/* ============ LIGHTBOX ============ */
.lb{position:fixed;inset:0;z-index:300;background:rgba(3,8,5,.95);display:none;touch-action:none}
.lb.show{display:block;animation:fadeIn .45s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.lb-stage{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;touch-action:none;cursor:grab}
.lb-stage:active{cursor:grabbing}
#lbImg{max-width:96vw;max-height:88vh;max-height:88svh;border-radius:12px;box-shadow:0 30px 100px rgba(0,0,0,.7);user-select:none;-webkit-user-select:none;-webkit-user-drag:none;transform-origin:50% 50%;will-change:transform}
.lb-x{position:absolute;z-index:3;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--gold-hi);background:rgba(6,14,9,.75);border:1px solid rgba(232,197,110,.45)}
.lb-hint{position:absolute;z-index:3;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font:300 .76rem var(--f-ui);color:var(--olive);pointer-events:none}

@media (max-width:520px){
  .seg button{padding:9px 11px;font-size:.7rem}
  .snd{width:38px;height:38px}
  .portal-bar .dots2{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>

<div class="ui">

  };
  function zoomAt(cx, cy, ns) {
    ns = Math.min(6, Math.max(1, ns));
    const r = stage.getBoundingClientRect(), px = cx - (r.left + r.width / 2), py = cy - (r.top + r.height / 2);
    x = px - (px - x) * (ns / s); y = py - (py - y) * (ns / s); s = ns;
    if (s === 1) { x = 0; y = 0; }
    clamp(); apply();
  }
  const isOpen = () => el.classList.contains('show');
  let fromEl = null, closing = false;
  const T0 = 'translate3d(0px,0px,0) scale(1)', EASE = 'cubic-bezier(.22,.8,.22,1)';
  const flipTo = (a, b) => `translate3d(${a.left + a.width / 2 - (b.left + b.width / 2)}px,${a.top + a.height / 2 - (b.top + b.height / 2)}px,0) scale(${a.width / b.width})`;
  function open(src, from) {
    if (closing) return;
    fromEl = from || null; img.src = src; s = 1; x = 0; y = 0; img.style.transform = T0; img.style.opacity = '0';
    el.classList.add('show'); document.body.classList.add('noscroll'); $('#lbX').focus({ preventScroll: true });
    const run = () => {
      img.style.opacity = '';
      if (!fromEl || RM) return;
      const a = fromEl.getBoundingClientRect(), b = img.getBoundingClientRect(); if (!a.width || !b.width) return;
      img.animate([{ transform: flipTo(a, b), borderRadius: '26px' }, { transform: T0, borderRadius: '12px' }], { duration: 780, easing: EASE });
    };
    (img.decode ? img.decode() : Promise.reject()).then(run, run);
  }
  function close() {
    if (!isOpen() || closing) return; closing = true;
    const cur = img.style.transform || T0;
    img.style.transform = T0; const b = img.getBoundingClientRect(); img.style.transform = cur;
    const a = fromEl && fromEl.getBoundingClientRect();
    const finish = () => { img.getAnimations().forEach(x => x.cancel()); el.getAnimations().forEach(x => x.cancel()); el.classList.remove('show'); img.style.transform = ''; document.body.classList.remove('noscroll'); closing = false; };
    if (RM) return finish();
    el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 560, easing: 'ease-in', fill: 'forwards' });
    if (a && a.width && b.width && a.bottom > 0 && a.top < innerHeight) img.animate([{ transform: cur }, { transform: flipTo(a, b), borderRadius: '26px' }], { duration: 560, easing: 'cubic-bezier(.5,0,.2,1)', fill: 'forwards' });
    setTimeout(finish, 590);
  }
  stage.addEventListener('pointerdown', e => {
    stage.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) { moved = 0; downT = e.target; }
    if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pd = Math.hypot(a.x - b.x, a.y - b.y); moved = 99; }
  });
  stage.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
    if (ptrs.size === 1) { if (s > 1) { x += dx; y += dy; clamp(); apply(); } }
    else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y); if (pd) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, s * d / pd); pd = d; }
  });
  const up = e => {
    const had = ptrs.delete(e.pointerId); pd = 0;
    if (!had || e.type !== 'pointerup' || ptrs.size || moved > 8) return;
    const now = performance.now();
    if (now - lastTap.t < 320 && Math.hypot(e.clientX - lastTap.x, e.clientY - lastTap.y) < 30) { zoomAt(e.clientX, e.clientY, s > 1.2 ? 1 : 2.6); lastTap.t = 0; return; }
    lastTap = { t: now, x: e.clientX, y: e.clientY };
    if (downT === stage) close();
  };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, s * Math.exp(-e.deltaY * .0018)); }, { passive: false });
  $('#lbX').addEventListener('click', close);
  addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  addEventListener('resize', () => { clamp(); apply(); });
  return { open, close, isOpen };
})();

/* =====================================================================
   CỔNG TRƯỜNG: bấm vào khung nhỏ -> phóng to thành cửa sổ lớn
   ===================================================================== */
const PZ = (() => {
  const el = $('#pz'), win = $('#pzWin'), fr = $('#portalFrame');
  let from = null, started = false, busy = false;
  const isOpen = () => el.classList.contains('show');
  const flipTo = (a, b) => `translate(${a.left + a.width / 2 - (b.left + b.width / 2)}px,${a.top + a.height / 2 - (b.top + b.height / 2)}px) scale(${a.width / b.width},${a.height / b.height})`;
  function open(fromEl) {
    if (isOpen() || busy) return;
    from = fromEl; el.classList.add('show'); document.body.classList.add('noscroll');
    if (!started) {
      started = true;
      fr.addEventListener('load', () => win.classList.add('loaded'), { once: true });
      fr.src = CONFIG.siteUrl; setTimeout(() => win.classList.add('loaded'), 5000);
    } else win.classList.add('loaded');
    const a = fromEl.getBoundingClientRect(), b = win.getBoundingClientRect();
    if (!RM && b.width) {
      win.animate([{ transform: flipTo(a, b), opacity: .3 }, { transform: 'none', opacity: 1 }], { duration: 800, easing: 'cubic-bezier(.22,.8,.22,1)' });
      el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 520 });
    }
    FX.burst(a.left + a.width / 2, a.top + a.height / 2, 30, 6);
    $('#pzX').focus({ preventScroll: true });
  }
  function close() {
    if (!isOpen() || busy) return; busy = true;
    const finish = () => { win.getAnimations().forEach(x => x.cancel()); el.getAnimations().forEach(x => x.cancel()); el.classList.remove('show'); document.body.classList.remove('noscroll'); busy = false; };
    const a = from && from.getBoundingClientRect(), b = win.getBoundingClientRect();
    if (RM || !a || !a.width || a.bottom < 0 || a.top > innerHeight) return finish();
    win.animate([{ transform: 'none', opacity: 1 }, { transform: flipTo(a, b), opacity: .2 }], { duration: 600, easing: 'cubic-bezier(.5,0,.2,1)', fill: 'forwards' });
    el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 600, fill: 'forwards' });
    setTimeout(finish, 620);
  }
  $('#pzX').addEventListener('click', close);
  el.addEventListener('pointerdown', e => { if (e.target === el) close(); });
  addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  return { open, close, isOpen };
})();
const modalOpen = () => LB.isOpen() || PZ.isOpen();

/* =====================================================================
   CUỐN THIỆP — máy tính: lật từng trang đôi · điện thoại: cuộn dọc
   ===================================================================== */
const book = $('#book'), fitEl = $('#fit'), stageEl = $('#stage');
const BK = { s: -1, N: 8, leaves: $$('#book .leaf'), tIn: 0, tOut: 0 };
const SPREADS = [['in', 'title'], ['hello', 'details'], ['poem1', 'poem2'], ['map', 'portal'], ['photo1', 'm1'], ['m2', 'photo2'], ['photo3', 'm3'], ['end', 'sig']];
const BGMAP = [0, 2, 1, 2, 3, 3, 3, 0];
const face = p => $(`#book .page[data-p="${p}"]`);
const faces = () => $$('#book .page[data-p]').filter(p => !['cover', 'blank'].includes(p.dataset.p));
let opened = false;

// chấm chuyển trang
const dotsEl = $('#dots');
SPREADS.forEach((_, i) => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', String(i + 1)); b.addEventListener('click', () => goto(i)); dotsEl.appendChild(b); });

function fitBook() { fitEl.style.setProperty('--s', Math.max(.45, Math.min((innerWidth - 150) / 1200, (innerHeight - 112) / 720)).toFixed(4)); }
function fitMobileCard() { mgate.style.setProperty('--ms', Math.max(.3, Math.min((innerWidth - 56) / 600, (innerHeight - 230) / 720)).toFixed(4)); }
function zIdle() { const L = BK.leaves.length; BK.leaves.forEach((lf, i) => { lf.style.zIndex = lf.classList.contains('flipped') ? i + 1 : L + 1 - i; }); }

function setLive() { $$('#book .face').forEach(f => f.classList.remove('live')); if (BK.s >= 0) SPREADS[BK.s].forEach(p => face(p).classList.add('live')); }
function showSpread(s) {
  clearTimeout(BK.tIn); clearTimeout(BK.tOut);
  BK.tIn = setTimeout(() => { if (s >= 0) SPREADS[s].forEach(p => face(p).classList.add('in')); }, s === 0 ? 900 : 560);
  BK.tOut = setTimeout(() => { SPREADS.forEach((pair, i) => { if (i !== BK.s) pair.forEach(p => face(p).classList.remove('in')); }); }, 1750);
}
function goto(ns) {
  if (!isDesk() || !opened) return;
  ns = Math.max(-1, Math.min(BK.N - 1, ns)); if (ns === BK.s) return;
  const dir = ns > BK.s ? 1 : -1, want = ns + 1, L = BK.leaves.length, ch = [];
  BK.s = ns;
  BK.leaves.forEach((lf, i) => { if ((i < want) !== lf.classList.contains('flipped')) ch.push([lf, i]); });
  if (dir < 0) ch.reverse();
  ch.forEach(([lf, i], k) => {
    const to = i < want;
    lf.style.transitionDelay = (k * 130) + 'ms'; lf.style.zIndex = 60 + (dir > 0 ? i : L - i);
    lf.classList.add('turning'); lf.classList.toggle('flipped', to);
    setTimeout(() => { lf.classList.remove('turning'); lf.style.transitionDelay = ''; lf.style.zIndex = to ? i + 1 : L + 1 - i; }, 1620 + k * 130);
  });
  book.classList.toggle('closed', ns < 0);
  setLive();
  if (ns >= 0) { book.style.setProperty('--rx', '0deg'); book.style.setProperty('--ry', '0deg'); }
  showSpread(ns);
  if (ns >= 0) setBg(BGMAP[ns]);
  $$('#dots button').forEach((b, i) => b.classList.toggle('on', i === ns));
  $('#prevBtn').hidden = ns < 0; $('#nextBtn').disabled = ns === BK.N - 1;
  if (ns === BK.N - 1) setTimeout(() => FX.burst(innerWidth / 2, innerHeight * .45, 60, 7), 1100);
}
const next = () => goto(BK.s + 1), prev = () => goto(BK.s - 1);
$('#nextBtn').addEventListener('click', next); $('#prevBtn').addEventListener('click', prev);
addEventListener('keydown', e => {
  if (!isDesk() || !opened || modalOpen()) return;
  if (['ArrowRight', 'ArrowDown', 'PageDown'].includes(e.key) || (e.key === ' ' && !e.target.closest('button,a,[role=button]'))) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); prev(); }
  else if (e.key === 'Home') goto(0); else if (e.key === 'End') goto(BK.N - 1);
});
let lastWheel = 0;
addEventListener('wheel', e => {
  if (!isDesk() || !opened || modalOpen()) return;
  const now = performance.now(), d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
  if (Math.abs(d) < 18 || now - lastWheel < 950) return;
  lastWheel = now; d > 0 ? next() : prev();
}, { passive: true });
(function swipe() {
  let sx = 0, sy = 0, on = false;
  stageEl.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse') return; on = true; sx = e.clientX; sy = e.clientY; });
  stageEl.addEventListener('pointerup', e => {
    if (!on) return; on = false; const dx = e.clientX - sx, dy = e.clientY - sy;
    if (isDesk() && opened && Math.abs(dx) > 70 && Math.abs(dy) < 90) dx < 0 ? next() : prev();
  });
})();
// bìa nghiêng nhẹ theo con trỏ khi thiệp còn đóng
addEventListener('pointermove', e => {
  if (opened || !isDesk() || RM || e.pointerType !== 'mouse') return;
  book.style.setProperty('--ry', ((e.clientX / innerWidth - .5) * 16).toFixed(2) + 'deg');
  book.style.setProperty('--rx', (-(e.clientY / innerHeight - .5) * 11).toFixed(2) + 'deg');
}, { passive: true });

/* ----- điện thoại: hiện dần theo cuộn + đổi nền ----- */
let mobIO = null, bgIO = null;
function startMobile() {
  if (mobIO) return;
  mobIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && !isDesk()) { e.target.classList.add('in'); if (e.target.dataset.p === 'sig') FX.burst(innerWidth / 2, innerHeight * .5, 50, 6); } }), { threshold: .12, rootMargin: '0px 0px -5% 0px' });
  bgIO = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && !isDesk() && e.target.dataset.bg) setBg(+e.target.dataset.bg); }), { rootMargin: '-48% 0px -48% 0px' });
  faces().forEach(f => { mobIO.observe(f); bgIO.observe(f); });
}
let ticking = false;
addEventListener('scroll', () => {
  if (ticking || isDesk()) return; ticking = true;
  requestAnimationFrame(() => { const h = document.documentElement.scrollHeight - innerHeight; $('#prog').style.transform = `scaleX(${h > 0 ? Math.min(1, scrollY / h) : 0})`; ticking = false; });
}, { passive: true });

/* ----- chuyển chế độ khi xoay/đổi cỡ màn hình ----- */
let wasDesk = isDesk();
function applyMode() {
  const d = isDesk();
  document.body.classList.toggle('mode-desk', d); document.body.classList.toggle('mode-mob', !d);
  fitBook(); fitMobileCard();
  if (d !== wasDesk) {
    wasDesk = d;
    if (opened) {
      document.body.classList.remove('locked'); document.body.classList.add('ready');
      if (d) { // sang máy tính: đồng bộ lại trạng thái các lá
        book.classList.add('noanim'); BK.leaves.forEach((lf, i) => lf.classList.toggle('flipped', i < BK.s + 1)); zIdle(); setLive();
        faces().forEach(f => f.classList.remove('in')); if (BK.s >= 0) SPREADS[BK.s].forEach(p => face(p).classList.add('in'));
        requestAnimationFrame(() => requestAnimationFrame(() => book.classList.remove('noanim')));
      } else { startMobile(); faces().forEach(f => f.classList.add('in')); }
    }
  }
}
addEventListener('resize', applyMode);

/* =====================================================================
   MỞ THIỆP
   ===================================================================== */
const gate = $('#gate');
function begin() {
  if (opened) return; opened = true; SND.started = true;
  unlockSfx(); setTimeout(clickSfx, 120);
  if (SND.on) { bgm.volume = 0; const p = bgm.play(); if (p && p.then) p.then(() => fade(bgm, CONFIG.bgmVolume, 3200)).catch(() => {}); }
  gate.classList.add('opening');
  const desk = isDesk();
  const seal = desk ? $('#book .cover-art .seal') : $('#mgateCard .mfront .seal');
  const r = seal.getBoundingClientRect();
  FX.burst(r.left + r.width / 2, r.top + r.height / 2, 90, 10);
  seal.classList.add('crack');
  if (desk) {
    setTimeout(() => { document.body.classList.add('ready'); goto(0); }, 480);
  } else {
    $('#mgateCard .mbase').classList.add('in');
    setTimeout(() => mgate.classList.add('open'), 480);
    setTimeout(() => { document.body.classList.remove('locked'); document.body.classList.add('ready'); startMobile(); scrollTo(0, 0); }, 2050);
    setTimeout(() => gate.classList.add('gone'), 2150);
  }
  setTimeout(() => gate.remove(), desk ? 1600 : 3400);
  if (desk) gate.classList.add('gone');
}
gate.addEventListener('click', begin);
gate.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); begin(); } });

/* =====================================================================
   KHỞI TẠO
   ===================================================================== */
zIdle(); render(); applyMode();
})();
</script>
</body>
</html>
